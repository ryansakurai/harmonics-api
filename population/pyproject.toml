[project]
name = "population"
version = "0.1.0"
description = ""
authors = [
    {name = "Ryan Sakurai",email = "ryansakurai03@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "neo4j (>=5.28.2,<6.0.0)",
    "pymongo (>=4.15.1,<5.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "faker (>=37.8.0,<38.0.0)",
    "google-genai (>=1.38.0,<2.0.0)",
    "ipykernel (>=6.30.1,<7.0.0)",
    "numpy (>=2.3.3,<3.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "spotipy (>=2.25.1,<3.0.0)"
]

[tool.poetry]
packages = [{include = "population", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=25.9.0,<26.0.0)",
    "pylint (>=3.3.8,<4.0.0)",
    "isort (>=6.0.1,<7.0.0)"
]
